<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 52" width="240" height="52" fill="none">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="viralGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38b035"/>
      <stop offset="100%" stop-color="#1e781c"/>
    </linearGradient>
    <linearGradient id="sparkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd13b"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#31942e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Logo Icon Container: Rounded Badge with Play & Spark -->
  <g transform="translate(4, 4)">
    <!-- Base Rounded Squircle -->
    <rect x="0" y="0" width="44" height="44" rx="12" fill="url(#viralGreen)" filter="url(#glow)"/>
    
    <!-- Film Strip Accent Notches -->
    <rect x="5" y="4" width="3" height="4" rx="1" fill="#ffffff" opacity="0.4"/>
    <rect x="5" y="36" width="3" height="4" rx="1" fill="#ffffff" opacity="0.4"/>
    <rect x="36" y="4" width="3" height="4" rx="1" fill="#ffffff" opacity="0.4"/>
    <rect x="36" y="36" width="3" height="4" rx="1" fill="#ffffff" opacity="0.4"/>

    <!-- Central Play Triangle with Soft Corners -->
    <path d="M17 14.5 C17 13.2 18.4 12.4 19.5 13.1 L31 19.8 C32.1 20.4 32.1 22.0 31 22.7 L19.5 29.4 C18.4 30.1 17 29.3 17 28.0 Z" fill="#ffffff"/>
    
    <!-- Viral Flame / Spark Accent on Top-Right -->
    <circle cx="35" cy="9" r="4.5" fill="url(#sparkGold)"/>
    <path d="M35 5 L36.2 8.2 L39.5 9 L36.2 9.8 L35 13 L33.8 9.8 L30.5 9 L33.8 8.2 Z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(56, 32)">
    <!-- VIRAL -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Sans', sans-serif" font-weight="900" font-size="22" letter-spacing="-0.5" fill="#253137">
      VIRAL
    </text>
    <!-- VIDEO -->
    <text x="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Sans', sans-serif" font-weight="900" font-size="22" letter-spacing="-0.5" fill="url(#viralGreen)">
      VIDEO
    </text>
    <!-- Subtitle Pill -->
    <text x="1" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="8" letter-spacing="1.8" fill="#888888">
      MOVIES &amp; SERIES REVIEWS
    </text>
  </g>
</svg>
